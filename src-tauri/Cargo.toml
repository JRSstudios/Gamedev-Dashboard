[package]
name = "gamedev-dashboard"
version = "0.1.0"
description = "Local-first overview for game projects: goals, assets, notes"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gamedev_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
